name: alacena_local
description: Inventario doméstico local con lotes FEFO, alertas, calendario y lista de compras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8

  # Persistencia local
  sqflite: 2.4.1
  path: ^1.9.1
  path_provider: 2.1.5

  # Captura de imágenes
  image_picker: 1.1.2

  # Calendario y localización
  table_calendar: 3.2.1
  intl: ^0.20.3

  # Widgets adicionales
  badges: 3.1.2
  flutter_slidable: 3.1.2
  fl_chart: 0.70.2

  # Notificaciones locales y zonas horarias
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
